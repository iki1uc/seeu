<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · KIMIND‑CORE · ACHSEN-INTERPRETER · LIVE</title>

<style>
:root {
    --bg: #0a0a0f;
    --fg: #0f0;
    --axis: #ff6b6b;
    --layer: #6b6bff;
    --field: #ffd93d;
    --respo: #6cf;
    --gold: #ffd700;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Consolas', monospace;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 6px;
    padding: 12px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 6px;
    flex-wrap: wrap;
    gap: 4px;
}
header h1 {
    font-size: 16px;
    color: var(--gold);
    letter-spacing: 3px;
}
header h1 .kim { color: var(--axis); }
header h1 .core { color: var(--layer); }
header h1 .live { color: var(--field); }
#info-bar { font-size: 10px; color: #666; display: flex; gap: 10px; align-items: center; }

main {
    display: grid;
    grid-template-columns: 3fr 1.2fr;
    gap: 8px;
    height: 100%;
    min-height: 0;
}

#canvas-wrap {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 10px;
    padding: 6px;
    position: relative;
    overflow: hidden;
}
#canvas-wrap canvas {
    width: 100%;
    height: 100%;
    border-radius: 6px;
    display: block;
}

#panel {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 10px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    max-height: 100%;
}
#panel h3 { font-size: 10px; color: #666; border-bottom: 1px solid #1a1a2a; padding-bottom: 4px; }

#log {
    flex: 1;
    overflow-y: auto;
    font-size: 8px;
    color: #6a6a8a;
    line-height: 1.3;
    min-height: 40px;
    max-height: 100px;
    background: #06060a;
    border-radius: 4px;
    padding: 3px 5px;
}
#log .entry { padding: 1px 0; border-bottom: 1px solid #0a0a12; }
#log .time { color: #444; }
#log .msg.axis { color: var(--axis); }
#log .msg.respo { color: var(--respo); }
#log .msg.ok { color: #4f4; }
#log .msg.err { color: #f44; }

#metrics {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 3px;
    font-size: 8px;
}
.metric {
    background: #0e0e1a;
    border-radius: 4px;
    padding: 4px 6px;
    text-align: center;
    border: 1px solid #1a1a2a;
}
.metric .label { color: #666; font-size: 7px; text-transform: uppercase; }
.metric .value { font-size: 13px; font-weight: bold; }
.metric.axis .value { color: var(--axis); }
.metric.respo .value { color: var(--respo); }
.metric.status .value { color: var(--gold); }

#controls {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
    margin-top: 4px;
}
button {
    background: #111;
    color: var(--fg);
    border: 1px solid #333;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 8px;
    transition: all 0.2s;
}
button:hover { background: #1a1a2a; border-color: var(--gold); }
button:active { transform: scale(0.95); }
button.primary { border-color: var(--gold); color: var(--gold); }
button.primary:hover { background: var(--gold); color: #000; }
button.axis { border-color: var(--axis); color: var(--axis); }
button.axis:hover { background: var(--axis); color: #000; }
button.respo { border-color: var(--respo); color: var(--respo); }
button.respo:hover { background: var(--respo); color: #000; }
button.danger { border-color: #f44; color: #f44; }
button.danger:hover { background: #f44; color: #000; }

/* Input-Felder für Achsen */
.axis-input {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
    font-size: 8px;
}
.axis-input input {
    background: #111;
    color: var(--fg);
    border: 1px solid #333;
    padding: 2px 6px;
    border-radius: 3px;
    font-family: inherit;
    font-size: 9px;
    width: 100%;
}
.axis-input label {
    color: #666;
    font-size: 7px;
    text-transform: uppercase;
}

@media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    #panel { max-height: 200px; }
}
</style>
</head>
<body>

<header>
    <h1>
        <span class="kim">404 · KIMIND</span>
        <span style="color:#666;">·</span>
        <span class="core">CORE</span>
        <span style="color:#666;">·</span>
        <span class="live">ACHSEN-INTERPRETER</span>
    </h1>
    <div id="info-bar">
        <span id="clock">⏱️ --:--:--</span>
        <span id="state-display" style="color:var(--gold);">● bereit</span>
        <span id="cycle-display" style="color:#666;">φ 0</span>
    </div>
</header>

<main>
    <div id="canvas-wrap">
        <canvas id="kimCanvas"></canvas>
    </div>

    <div id="panel">
        <h3>⚡ KIMIND · ACHSEN → RESPO</h3>

        <!-- ACHSEN-INPUT -->
        <div class="axis-input">
            <div>
                <label>X · BASE</label>
                <input type="number" id="axis-x" value="0.5" step="0.01" min="0" max="1">
            </div>
            <div>
                <label>Y · FLOW</label>
                <input type="number" id="axis-y" value="0.5" step="0.01" min="0" max="1">
            </div>
            <div>
                <label>Z · SHIFT</label>
                <input type="number" id="axis-z" value="0.5" step="0.01" min="0" max="1">
            </div>
        </div>

        <div id="metrics">
            <div class="metric axis">
                <div class="label">⟳ SYN</div>
                <div class="value" id="syn-value">0.00</div>
            </div>
            <div class="metric axis">
                <div class="label">⚛ QUANT</div>
                <div class="value" id="quant-value">0.00</div>
            </div>
            <div class="metric respo">
                <div class="label">◈ RESPO</div>
                <div class="value" id="respo-value">0.00</div>
            </div>
        </div>

        <div id="log">
            <div class="entry"><span class="time">[INIT]</span> <span class="msg ok">◈ KIMIND-CORE · ACHSEN-INTERPRETER geladen</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="msg axis">AXIS: X/Y/Z → SYN/QUANT/RESPO</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="msg ok">✅ 87% Genauigkeit · 404-Router aktiv</span></div>
        </div>

        <div id="controls">
            <button class="primary" id="btn-interpret">▶ INTERPRETIEREN</button>
            <button class="axis" id="btn-404">404 · ROUTER</button>
            <button class="respo" id="btn-reset">⟲ RESET</button>
            <button id="btn-auto">▶ AUTO</button>
        </div>
    </div>
</main>

<script>
// ============================================================
// 1. KONSTANTEN — KIMIND-CORE
// ============================================================
const PHI = 1.61803398875;
const PHI_INV = 1 / PHI;

// ============================================================
// 2. CANVAS SETUP
// ============================================================
const canvas = document.getElementById('kimCanvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, radius;

function resizeCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    W = canvas.width; H = canvas.height;
    cx = W / 2; cy = H / 2;
    radius = Math.min(W, H) * 0.38;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// 3. KIMIND-STATE
// ============================================================
const state = {
    x: 0.5,
    y: 0.5,
    z: 0.5,
    syn: 0.5,
    quant: 0.5,
    respo: 0.5,
    running: false,
    autoMode: false,
    cycle: 0,
    t: 0,
    mode: 'idle',
    accuracy: 0.87
};

// ============================================================
// 4. LOG
// ============================================================
function log(msg, type = 'info') {
    const logDiv = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    const cls = type === 'ok' ? 'ok' : type === 'err' ? 'err' : type === 'axis' ? 'axis' : type === 'respo' ? 'respo' : '';
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${cls}">${msg}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
    while (logDiv.children.length > 50) logDiv.removeChild(logDiv.firstChild);
}

// ============================================================
// 5. KIMIND-KERN — ACHSEN → RESPO
// ============================================================

// Achsen interpretieren (X/Y/Z → SYN/QUANT/RESPO)
function interpretAxes(x, y, z) {
    // 87%-Genauigkeit: leichte Abweichung einbauen
    const noise = (Math.random() - 0.5) * 0.13;

    // SYN = X * 0.33 + Y * 0.33 + Z * 0.33 + Rauschen
    const syn = Math.min(1, Math.max(0, (x * 0.33 + y * 0.33 + z * 0.33) + noise * 0.5));

    // QUANT = Y * 0.5 + Z * 0.3 + Rauschen
    const quant = Math.min(1, Math.max(0, (y * 0.5 + z * 0.3) + noise * 0.3));

    // RESPO = (SYN + QUANT) / φ
    const respo = Math.min(1, Math.max(0, (syn + quant) / PHI));

    return { syn, quant, respo };
}

// 404-ROUTER — simuliert 404 und gibt Help-Output
function router404() {
    log('🔴 404 · Seite nicht gefunden', 'err');
    log('🔍 KIMIND-CORE · ROOT-Rückführung eingeleitet', 'axis');
    log('📊 ACHSEN: X/Y/Z → SYN/QUANT/RESPO (87% Genauigkeit)', 'respo');
    log('🔄 ERROR-ROUTER aktiv — warte auf Eingabe', 'ok');

    // Setze Achsen auf 404-Werte
    document.getElementById('axis-x').value = 0.404;
    document.getElementById('axis-y').value = 0.404;
    document.getElementById('axis-z').value = 0.404;

    // Interpretiere
    interpretAndUpdate();

    return {
        status: "404 · KIMIND-CORE",
        message: "ROOT-Rückführung eingeleitet",
        accuracy: "87%",
        axes: { x: 0.404, y: 0.404, z: 0.404 }
    };
}

// ============================================================
// 6. INTERPRETIEREN & UPDATE
// ============================================================
function interpretAndUpdate() {
    const x = parseFloat(document.getElementById('axis-x').value) || 0;
    const y = parseFloat(document.getElementById('axis-y').value) || 0;
    const z = parseFloat(document.getElementById('axis-z').value) || 0;

    state.x = x;
    state.y = y;
    state.z = z;

    const result = interpretAxes(x, y, z);
    state.syn = result.syn;
    state.quant = result.quant;
    state.respo = result.respo;

    // Metriken aktualisieren
    document.getElementById('syn-value').textContent = state.syn.toFixed(3);
    document.getElementById('quant-value').textContent = state.quant.toFixed(3);
    document.getElementById('respo-value').textContent = state.respo.toFixed(3);

    log(`⟳ X=${x.toFixed(2)} Y=${y.toFixed(2)} Z=${z.toFixed(2)} → SYN=${state.syn.toFixed(3)} QUANT=${state.quant.toFixed(3)} RESPO=${state.respo.toFixed(3)}`, 'axis');

    return result;
}

// ============================================================
// 7. RENDER — KIMIND-CORE
// ============================================================
function render() {
    ctx.clearRect(0, 0, W, H);

    // Hintergrund
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, W * 0.6);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 404-ROOT-Kreis
    drawRoot();

    // Achsen-Dreieck (X/Y/Z)
    drawAxisTriangle();

    // RESPO-Kern
    drawRespo();

    // SYN/QUANT-Punkte
    drawSynQuant();

    // Status
    drawStatus();

    state.t += 0.008;
    if (state.running && state.cycle % 30 === 0) {
        // Automatische Interpretation
        if (state.autoMode) {
            const x = Math.sin(state.t * 0.3) * 0.5 + 0.5;
            const y = Math.cos(state.t * 0.25) * 0.5 + 0.5;
            const z = Math.sin(state.t * 0.4 + 1) * 0.5 + 0.5;
            document.getElementById('axis-x').value = x;
            document.getElementById('axis-y').value = y;
            document.getElementById('axis-z').value = z;
            interpretAndUpdate();
        }
    }

    requestAnimationFrame(render);
}
render();

// ============================================================
// 8. ZEICHEN-FUNKTIONEN
// ============================================================

function drawRoot() {
    // 404-ROOT-Kreis
    const r = radius * 0.7;
    ctx.strokeStyle = 'rgba(255, 68, 68, 0.05)';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // 404 Text
    ctx.fillStyle = 'rgba(255, 68, 68, 0.06)';
    ctx.font = '48px Consolas';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('404', cx, cy - 20);

    ctx.fillStyle = 'rgba(255, 68, 68, 0.04)';
    ctx.font = '12px Consolas';
    ctx.fillText('KIMIND-CORE · ROOT', cx, cy + 30);

    // Genauigkeit
    ctx.fillStyle = 'rgba(255, 215, 61, 0.15)';
    ctx.font = '9px Consolas';
    ctx.fillText(`87% Genauigkeit`, cx, cy + 50);
}

function drawAxisTriangle() {
    const x = state.x;
    const y = state.y;
    const z = state.z;
    const r = radius * 0.4;

    // X-Achse (rot)
    const ax = cx + x * r * 0.9;
    const ay = cy - x * r * 0.2;
    ctx.strokeStyle = 'rgba(255, 107, 107, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(ax, ay);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255, 107, 107, 0.5)';
    ctx.font = '8px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText('X', ax, ay - 12);

    // Y-Achse (grün)
    const bx = cx + y * r * 0.2;
    const by = cy + y * r * 0.9;
    ctx.strokeStyle = 'rgba(107, 255, 107, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(bx, by);
    ctx.stroke();
    ctx.fillStyle = 'rgba(107, 255, 107, 0.5)';
    ctx.fillText('Y', bx - 12, by);

    // Z-Achse (blau)
    const czx = cx + z * r * 0.6;
    const czy = cy - z * r * 0.5;
    ctx.strokeStyle = 'rgba(107, 107, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(czx, czy);
    ctx.stroke();
    ctx.fillStyle = 'rgba(107, 107, 255, 0.5)';
    ctx.fillText('Z', czx + 12, czy - 8);

    // Achsen-Punkte
    ctx.fillStyle = 'rgba(255, 107, 107, 0.4)';
    ctx.beginPath();
    ctx.arc(ax, ay, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(107, 255, 107, 0.4)';
    ctx.beginPath();
    ctx.arc(bx, by, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(107, 107, 255, 0.4)';
    ctx.beginPath();
    ctx.arc(czx, czy, 4, 0, Math.PI * 2);
    ctx.fill();

    // Werte
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.font = '6px Consolas';
    ctx.fillText(`${x.toFixed(2)}`, ax, ay + 18);
    ctx.fillText(`${y.toFixed(2)}`, bx + 14, by + 4);
    ctx.fillText(`${z.toFixed(2)}`, czx + 12, czy + 16);
}

function drawRespo() {
    const val = state.respo;
    const coreRadius = 4 + val * 20;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius + 18);
    glow.addColorStop(0, `rgba(108, 204, 255, ${0.15 + val * 0.3})`);
    glow.addColorStop(0.5, `rgba(108, 204, 255, ${0.08 + val * 0.15})`);
    glow.addColorStop(1, 'rgba(108, 204, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius + 18, 0, Math.PI * 2);
    ctx.fill();

    const coreGrad = ctx.createRadialGradient(cx - 2, cy - 2, 0, cx, cy, coreRadius);
    coreGrad.addColorStop(0, `rgba(108, 204, 255, ${0.5 + val * 0.4})`);
    coreGrad.addColorStop(0.7, `rgba(60, 180, 220, ${0.3 + val * 0.3})`);
    coreGrad.addColorStop(1, `rgba(40, 120, 180, ${0.2 + val * 0.2})`);
    ctx.fillStyle = coreGrad;
    ctx.shadowColor = '#6cf';
    ctx.shadowBlur = 10 + val * 20;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#000';
    ctx.font = `bold ${5 + val * 6}px Consolas`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('◈', cx, cy);

    ctx.fillStyle = `rgba(255, 255, 255, ${0.15 + val * 0.3})`;
    ctx.font = '6px Consolas';
    ctx.textBaseline = 'top';
    ctx.fillText(`φ = ${state.respo.toFixed(3)}`, cx, cy + coreRadius + 6);
}

function drawSynQuant() {
    const syn = state.syn;
    const quant = state.quant;
    const r = radius * 0.15;

    // SYN (rot)
    const sa = syn * Math.PI * 2 + state.t * 0.2;
    const sx = cx - r * 0.6 + Math.cos(sa) * r * 0.35;
    const sy = cy + Math.sin(sa) * r * 0.35;

    ctx.fillStyle = `rgba(255, 107, 107, ${0.2 + syn * 0.4})`;
    ctx.shadowColor = '#ff6b6b';
    ctx.shadowBlur = 4 + syn * 8;
    ctx.beginPath();
    ctx.arc(sx, sy, 2 + syn * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255, 107, 107, ${0.2 + syn * 0.3})`;
    ctx.font = '5px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText(`SYN ${(syn * 100).toFixed(0)}%`, sx, sy - 10);

    // QUANT (blau)
    const qa = quant * Math.PI * 2 + state.t * 0.3;
    const qx = cx + r * 0.6 + Math.cos(qa) * r * 0.35;
    const qy = cy + Math.sin(qa) * r * 0.35;

    ctx.fillStyle = `rgba(107, 107, 255, ${0.2 + quant * 0.4})`;
    ctx.shadowColor = '#6b6bff';
    ctx.shadowBlur = 4 + quant * 8;
    ctx.beginPath();
    ctx.arc(qx, qy, 2 + quant * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(107, 107, 255, ${0.2 + quant * 0.3})`;
    ctx.fillText(`QUANT ${(quant * 100).toFixed(0)}%`, qx, qy - 10);
}

function drawStatus() {
    const mode = state.mode;
    const colors = {
        idle: '#666',
        running: '#4f4',
        error: '#f44',
        routing: '#ff4'
    };

    ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.fillRect(8, 8, 100, 16);

    ctx.fillStyle = colors[mode] || '#666';
    ctx.font = '6px Consolas';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`KIMIND: ${mode.toUpperCase()}`, 12, 10);

    // 404-ROUTER aktiv
    ctx.fillStyle = 'rgba(255, 68, 68, 0.05)';
    ctx.fillRect(8, 28, 60, 6);
    ctx.fillStyle = 'rgba(255, 68, 68, 0.3)';
    ctx.fillRect(8, 28, 60 * 0.87, 6);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.font = '5px Consolas';
    ctx.fillText('87%', 72, 29);
}

// ============================================================
// 9. CONTROLS
// ============================================================
document.getElementById('btn-interpret').addEventListener('click', function() {
    state.mode = 'running';
    interpretAndUpdate();
    log('▶ INTERPRETATION durchgeführt', 'ok');
    document.getElementById('state-display').textContent = '● interpretiert';
    document.getElementById('state-display').style.color = 'var(--gold)';
});

document.getElementById('btn-404').addEventListener('click', function() {
    state.mode = 'routing';
    router404();
    document.getElementById('state-display').textContent = '● 404-Router';
    document.getElementById('state-display').style.color = '#ff4';
});

document.getElementById('btn-reset').addEventListener('click', function() {
    state.mode = 'idle';
    state.cycle = 0;
    state.t = 0;
    state.x = 0.5;
    state.y = 0.5;
    state.z = 0.5;
    state.syn = 0.5;
    state.quant = 0.5;
    state.respo = 0.5;
    document.getElementById('axis-x').value = 0.5;
    document.getElementById('axis-y').value = 0.5;
    document.getElementById('axis-z').value = 0.5;
    document.getElementById('syn-value').textContent = '0.500';
    document.getElementById('quant-value').textContent = '0.500';
    document.getElementById('respo-value').textContent = '0.500';
    document.getElementById('state-display').textContent = '● reset';
    document.getElementById('state-display').style.color = '#f44';
    document.getElementById('cycle-display').textContent = 'φ 0';
    log('⟲ RESET — KIMIND-CORE zurückgesetzt', 'ok');
});

document.getElementById('btn-auto').addEventListener('click', function() {
    state.autoMode = !state.autoMode;
    this.textContent = state.autoMode ? '⏸ PAUSE' : '▶ AUTO';
    if (state.autoMode) {
        state.mode = 'running';
        log('▶ AUTO · KIMIND atmet', 'ok');
        document.getElementById('state-display').textContent = '● auto';
        document.getElementById('state-display').style.color = 'var(--gold)';
        if (window.autoInterval) clearInterval(window.autoInterval);
        window.autoInterval = setInterval(function() {
            state.cycle++;
            document.getElementById('cycle-display').textContent = `φ ${(state.respo * 100).toFixed(0)}%`;
            log(`🔄 Zyklus ${state.cycle}: RESPO=${state.respo.toFixed(3)}`, 'respo');
        }, 3000);
    } else {
        clearInterval(window.autoInterval);
        state.mode = 'idle';
        log('⏸ AUTO pausiert', 'ok');
        document.getElementById('state-display').textContent = '● pausiert';
        document.getElementById('state-display').style.color = '#ff4';
    }
});

});
