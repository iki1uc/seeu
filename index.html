<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SEEÜ · EVO · PREFETCH · CONTINUUM</title>

<!-- PREFETCH-LINKS -->
<link rel="prefetch" href="https://iki1uc.github.io/AQUA/AQUA.static.yml">
<link rel="prefetch" href="https://iki1uc.github.io/EDIT/EDIT.static.yml">
<link rel="prefetch" href="https://iki1uc.github.io/CLOU/CLOU.static.yml">
<link rel="prefetch" href="https://iki1uc.github.io/WETTEN/WETTEN.static.yml">
<link rel="prefetch" href="https://iki1uc.github.io/6iy/6iy.static.yml">
<link rel="prefetch" href="https://iki1uc.github.io/beu/beu.static.yml">
<link rel="prefetch" href="https://iki1uc.github.io/xyz/xyz.static.yml">

<style>
  body { background:#000; color:#fff; font-family:Consolas; padding:20px; }
  pre { background:#111; padding:10px; border-left:4px solid #0ff; }
</style>
</head>

<body>

<h1>SEEÜ · EVO · PREFETCH · CONTINUUM</h1>

<pre id="prefetch_out"></pre>
<pre id="seeu_out"></pre>
<pre id="evo_out"></pre>
<pre id="motor_out"></pre>

<script>
// ------------------------------------------------------
// 1) PREFETCH · CORE
// ------------------------------------------------------
async function prefetch(url) {
  try {
    const res = await fetch(url, { cache: "force-cache" });
    return await res.text();
  } catch (e) {
    return null;
  }
}

const PREFETCH_LIST = [
  "https://iki1uc.github.io/AQUA/AQUA.static.yml",
  "https://iki1uc.github.io/EDIT/EDIT.static.yml",
  "https://iki1uc.github.io/CLOU/CLOU.static.yml",
  "https://iki1uc.github.io/WETTEN/WETTEN.static.yml",
  "https://iki1uc.github.io/6iy/6iy.static.yml",
  "https://iki1uc.github.io/beu/beu.static.yml",
  "https://iki1uc.github.io/xyz/xyz.static.yml"
];

async function PREFETCH_ALL() {
  const out = {};
  for (const url of PREFETCH_LIST) {
    out[url] = await prefetch(url);
  }
  document.getElementById("prefetch_out").innerText =
    JSON.stringify(out, null, 2);
  return out;
}

// ------------------------------------------------------
// 2) SEEÜ · MOTOR · PREFETCH-MODUS
// ------------------------------------------------------
const SEEUE = {
  step: 0,
  motor: false,

  start() {
    this.motor = true;
    this.loop();
  },

  stop() {
    this.motor = false;
  },

  loop() {
    if (!this.motor) return;
    this.step++;
    document.getElementById("motor_out").innerText =
      "SEEÜ Motor Step: " + this.step;
    setTimeout(() => this.loop(), 200);
  }
};

// ------------------------------------------------------
// 3) EVO · AKTEUR
// ------------------------------------------------------
const EVO = {
  state: "INIT",
  act(step) {
    this.state = "EVO@" + step;
    document.getElementById("evo_out").innerText =
      "EVO Zustand: " + this.state;
  }
};

// ------------------------------------------------------
// 4) CONTINUUM · MINIMAL
// ------------------------------------------------------
async function CONTINUUM() {
  const pf = await PREFETCH_ALL();
  SEEUE.start();

  setInterval(() => {
    EVO.act(SEEUE.step);
    document.getElementById("seeu_out").innerText =
      "SEEÜ Step: " + SEEUE.step;
  }, 300);
}

CONTINUUM();
</script>

</body>
</html>
