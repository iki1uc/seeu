// ------------------------------------------------------
// RESPO · A/B/C/D + CLAW (IX / XI / X4 / AIR / AIV)
// ------------------------------------------------------

function RESPO_CORE(key) {

  // Grundreaktion
  const base = {
    "a": { respo: "A", meaning: "nein" },
    "b": { respo: "B", meaning: "ja" },
    "c": { respo: "C", meaning: "weiter" },
    "d": { respo: "D", meaning: "ende" }
  }[key] || { respo: "C", meaning: "weiter" };

  // CLAW‑Layer Rotation
  const CLAWS = ["IX","XI","X4","AIR","AIV"];
  const claw = CLAWS[Math.floor(Math.random() * CLAWS.length)];

  return {
    respo: base.respo,
    meaning: base.meaning,
    claw: claw
  };
}
// ------------------------------------------------------
// TASTEN-ABFANG · RESPO + CLAW · 404-Schutz
// ------------------------------------------------------

window.addEventListener("keydown", function(e) {

  const key = e.key.toLowerCase();

  // Nur A/B/C/D für RESPO
  if (!["a","b","c","d"].includes(key)) return;

  // Browser-Navigation verhindern (404-Fix)
  e.preventDefault();

  // RESPO + CLAW erzeugen
  const out = RESPO_CORE(key);

  // Ausgabe sichtbar machen
  document.getElementById("krallen").textContent =
    `RESPO: ${out.respo}\nMEANING: ${out.meaning}\nCLAW: ${out.claw}`;

  // AHA koppeln
  AHA_REACT(out);

  // SEEÜ koppeln
  SEEUE_REACT(out);
});
// ------------------------------------------------------

}

      meaning: out.meaning,

}
