<script>
// ------------------------------------------------------
// 1) GATE-MATRIX · lernfähig
// ------------------------------------------------------
const GATE_MATRIX = {
  start8: { gate:"GATE",  math:"0",  home:"HOME-0" },
  AQUA:   { gate:"wLOCH", math:"1",  home:"HOME-1" },
  EDIT:   { gate:"HY",    math:"√2", home:"HOME-2" },
  CLOU:   { gate:"PE",    math:"π",  home:"HOME-3" },
  WETTEN: { gate:"PER",   math:"e",  home:"HOME-4" },
  "6iy":  { gate:"WARB",  math:"φ",  home:"HOME-5" },
  beu:    { gate:"TRANS", math:"∞",  home:"HOME-6" },
  xyz:    { gate:"KANAL", math:"∴",  home:"HOME-7" }
};

// GATE lernt dynamisch
function GATE_DYNAMIC(name){
  const base = GATE_MATRIX[name] || GATE_MATRIX["start8"];
  return {
    ...base,
    dyn: "DYN-" + Date.now()
  };
}

// ------------------------------------------------------
// 2) GEO-VECTOR · 3D + Animation
// ------------------------------------------------------
function GEO_VECTOR_3D(gate){
  return {
    x: gate.math.length * 10,
    y: gate.home.length * 5,
    z: gate.gate.length * 3,
    sat: gate.gate
  };
}

// ------------------------------------------------------
// 3) RADAR-SAT · Kreisradar
// ------------------------------------------------------
function RADAR_SAT_DRAW(geo){
  const c = document.getElementById("radarCanvas");
  const ctx = c.getContext("2d");

  ctx.clearRect(0,0,300,300);

  // Kreisradar
  ctx.beginPath();
  ctx.arc(150,150,140,0,Math.PI*2);
  ctx.strokeStyle="#0ff";
  ctx.lineWidth=3;
  ctx.stroke();

  // Punkt
  ctx.beginPath();
  ctx.arc(150 + geo.x/5, 150 + geo.y/5, 10, 0, Math.PI*2);
  ctx.fillStyle="#f0f";
  ctx.fill();
}

// Canvas vorbereiten
document.getElementById("radarCanvas").innerHTML =
  "<canvas width='300' height='300'></canvas>";
document.getElementById("radarCanvas").id = "radarCanvas";

    frage4: `Passt mein Zustand zum Continuum-Flow?`,
    frage5: `Welche mathematische Grundlage nutze ich (${gate.math})?`,
    frage6: `Was sagt mein RADAR-SAT (${geo.sat})?`
  };
}
