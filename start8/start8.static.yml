<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>X4 · Axiom‑4 · Parallel‑Core</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:30px; }
h1 { color:#f00; text-align:center; }

pre {
    background:#111;
    padding:20px;
    border-left:3px solid #f00;
    margin-top:30px;
}

#core {
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

.slot {
    width:80px;
    height:80px;
    border:2px solid #0f0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}
</style>
</head>

<body>

<h1>X4 · Axiom‑4 · Parallel‑Core</h1>

<div id="core">
    <div class="slot">X1</div>
    <div class="slot">X2</div>
    <div class="slot">X3</div>
    <div class="slot">X4</div>
</div>

<pre id="status">Lade X4…</pre>

<script>
// X4 ID
const X4_ID = {
    id: "X4-AXIOM-4",
    role: "Parallel-Core",
    axis: 4,
    probe: "CACHE",
    state: "READY"
};

// X4 Probe (minimal)
function X4_probe(){
    return {
        core: ["X1","X2","X3","X4"],
        status: "rdy",
        cache: "probe",
        file: "active"
    };
}

// Ausgabe
document.getElementById("status").innerText =
    JSON.stringify({ X4_ID, probe: X4_probe() }, null, 2);
</script>

</body>
</html>
