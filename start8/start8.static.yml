// --- 1. AXIOM-PRÜFER (synchron)
function ghostScan(r){
  if(r.MISS){
    return {
      NAME: r.NAME,
      RESULT: "FEHLT",
      ERROR: true,
      RAUM: "(keine Daten)"
    };
  }

  const WETTE = r.IST_IST !== r.SOLL;

  const SCORE =
      (r.STATUS === "1" ? 1 : 0) +
      (r.VERWALTUNG3.SET.UP ? 1 : 0) +
      (r.VERWALTUNG3.IO.IN ? 1 : 0) +
      (r.VERWALTUNG3.EXE.RUN ? 1 : 0) +
      (r.WAHRHEIT === "REAL" ? 1 : 0) +
      (r.RAUM.X + r.RAUM.Z);

  return {
    NAME: r.NAME,
    ID: r.ID,
    RAUM: r.RAUM,
    STATUS: r.STATUS,
    RESULT: WETTE ? "HELFEN" : "OK",
    SCORE,
    WETTE,
    OUT: r.VERWALTUNG3,
    WAHRHEIT: r.WAHRHEIT,
    EDIT: r.IST_IST
  };
}


// --- 2. BIL-MAUS (asynchron)
async function BIL_MAUS_START() {
  try {
    const r = await fetch("./BIL/RAUM.json");
    const data = await r.json();

    const out = ghostScan(data);

    window.BIL_RAUM   = out.RAUM;
    window.BIL_SCORE  = out.SCORE;
    window.BIL_WETTE  = out.WETTE;
    window.BIL_RESULT = out.RESULT;

    console.log("BIL-MAUS AKTIV:", window.BIL_RAUM);

  } catch(e) {
    console.error("BIL-MAUS FEHLER:", e);
  }
}

// --- 3. Starten
BIL_MAUS_START();
